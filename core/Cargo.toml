[package]
name = "readcon-ops-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Compiled kernels for readcon-ops: min-image displacement, Kabsch alignment, RMSD and distance matrices"
license = "BSD-3-Clause"
repository = "https://github.com/lode-org/readcon-ops"

[lib]
name = "readcon_ops_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Exactly rounded, order- and rank-invariant reductions (src/exact.rs).
exact = []
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rayon = "1.10"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
pyo3 = { version = "0.28", optional = true }
numpy = { version = "0.28", optional = true }

[profile.release]
# Same rounding on every path: no fast-math, one codegen unit.
codegen-units = 1
