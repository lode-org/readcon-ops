name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest tests -q --tb=short

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.17.0
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Install Sphinx
        run: python -m pip install -r docs/requirements.txt
      - name: Export org to rst
        run: sh docs/export.sh
      - name: Build HTML
        run: python -m sphinx -W -b html docs/source docs/build/html

  kernels:
    name: compiled kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml --features exact
      - name: Install with the extension
        run: python -m pip install -e . ./core pytest
      - name: Test
        run: python -m pytest tests -q --tb=short
      - name: Benchmark smoke
        run: python bench/bench_kernels.py 20 50 1

  mpi:
    name: MPI ${{ matrix.mpi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mpi: mpich
            packages: mpich libmpich-dev
            cc: mpicc.mpich
            launcher: mpiexec.mpich -n
          - mpi: openmpi
            packages: openmpi-bin libopenmpi-dev
            cc: mpicc.openmpi
            launcher: mpiexec.openmpi --oversubscribe -n
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install one MPI implementation
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Install
        run: |
          MPICC=${{ matrix.cc }} python -m pip install --no-binary mpi4py mpi4py
          python -m pip install -e . ./core
      - name: Same bits on 1 to 4 ranks
        run: |
          set -euo pipefail
          for p in 1 2 3 4; do
            ${{ matrix.launcher }} $p python tests/mpi/check_parallel.py | tail -1 | tee -a digests.txt
          done
          test "$(awk '{print $3}' digests.txt | sort -u | wc -l)" -eq 1
