[project]
name = "readcon-ops"
version = "0.1.1"
description = "Comparisons and rigid alignment of readcon frames. Not the CON codec and not the corpus."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
authors = [{name = "Rohit Goswami", email = "rgoswami@ieee.org"}]
dependencies = [
  "numpy>=1.24",
  "minimage @ git+https://github.com/lode-org/minimage.git@0545e172d88a887c6d9d8e3977e5c12fc1ba6f38",
]
keywords = ["readcon", "con", "structure", "matching"]

[project.urls]
Homepage = "https://github.com/lode-org/readcon-ops"
Repository = "https://github.com/lode-org/readcon-ops"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/readcon_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
